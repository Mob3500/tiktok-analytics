<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TikTok Analytics</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  
  <!-- Login Card -->
  <div class="w-full max-w-md">
    <!-- Logo/Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-full mb-4">
        <div class="w-12 h-12 bg-black rounded-full flex items-center justify-center text-white text-sm font-bold">
          TT
        </div>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">TikTok Analytics</h1>
      <p class="text-white text-opacity-90">Sign in to your account</p>
    </div>
    
    <!-- Login Form -->
    <div class="bg-white rounded-lg shadow-2xl p-8">
      <!-- Error Message -->
      <div id="error-message" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
        <div class="flex items-center">
          <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
          <span class="text-red-700 text-sm" id="error-text"></span>
        </div>
      </div>
      
      <!-- Form -->
      <form id="login-form">
        <!-- Email Field -->
        <div class="mb-6">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-envelope text-gray-400"></i>
            </div>
            <input 
              type="email" 
              id="email" 
              name="email"
              required
              class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="you@example.com"
            >
          </div>
        </div>
        
        <!-- Password Field -->
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-lock text-gray-400"></i>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password"
              required
              class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="••••••••"
            >
          </div>
        </div>
        
        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between mb-6">
          <label class="flex items-center">
            <input type="checkbox" class="rounded border-gray-300 text-purple-600 focus:ring-purple-500">
            <span class="ml-2 text-sm text-gray-600">Remember me</span>
          </label>
          <a href="#" class="text-sm text-purple-600 hover:text-purple-700">
            Forgot password?
          </a>
        </div>
        
        <!-- Submit Button -->
        <button 
          type="submit" 
          id="login-btn"
          class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 px-4 rounded-lg font-medium hover:from-purple-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transition-all"
        >
          <span id="login-btn-text">Sign In</span>
          <i id="login-btn-spinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
        </button>
      </form>
      
      <!-- Register Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Don't have an account? 
          <a href="register.html" class="text-purple-600 hover:text-purple-700 font-medium">
            Sign up
          </a>
        </p>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="text-center mt-8 text-white text-opacity-75 text-sm">
      <p>&copy; 2025 TikTok Analytics. All rights reserved.</p>
    </div>
  </div>
  
  <!-- JavaScript -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Initialize login form
    document.getElementById('login-form').addEventListener('submit', handleLogin);
  </script>
</body>
</html>
